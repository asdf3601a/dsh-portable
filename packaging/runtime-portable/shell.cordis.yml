# Portable overlay: switch the host shell executor with DSH_SHELL resolved by dsh.cmd.
# The argv preload passes this file as `--patch`; built-in preset tools use the same switch.

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.env.DSH_SHELL !== 'bash'
  config:
    timeoutMs: 60000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.env.DSH_SHELL === 'bash'
