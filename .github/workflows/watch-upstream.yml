name: watch-upstream

on:
  schedule:
    # Wednesday 00:00 UTC (08:00 CST). GitHub cron can drift by tens of minutes.
    - cron: '0 0 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect latest unpublished upstream dsh-v*
    runs-on: ubuntu-latest
    outputs:
      has_pending: ${{ steps.resolve.outputs.has_pending }}
      dsh_version: ${{ steps.resolve.outputs.dsh_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest upstream version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/resolve-upstream.ps1 -ThisRepo $env:GITHUB_REPOSITORY

  publish:
    name: Publish ${{ needs.detect.outputs.dsh_version }}
    needs: detect
    if: needs.detect.outputs.has_pending == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      dsh_version: ${{ needs.detect.outputs.dsh_version }}
