name: release

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 'Upstream dsh version to package'
        required: true
        type: string
  workflow_call:
    inputs:
      dsh_version:
        description: 'Upstream dsh version to package'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, smoke, publish
    runs-on: windows-latest
    concurrency:
      group: dsh-portable-release-${{ inputs.dsh_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Skip if release asset already exists
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          $ver = $env:DSH_VERSION
          if (-not $ver) { throw 'dsh_version input is required' }
          $tag = "dsh-v$ver"
          $requiredAssets = @("dsh-portable-$ver-win-x64.zip", 'SHA256SUMS.txt')
          $exists = $false
          $raw = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $rel = $raw | ConvertFrom-Json
            $assetNames = @($rel.assets | ForEach-Object { $_.name })
            $exists = @($requiredAssets | Where-Object { $_ -notin $assetNames }).Count -eq 0
          }
          if ($exists) {
            Write-Host "Release $tag already has the portable assets — skipping build"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build portable ZIP
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          ./scripts/build-windows.ps1 `
            -DshVersion $env:DSH_VERSION `
            -Source auto

      - name: Smoke test packaged ZIP
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          $zip = Resolve-Path -LiteralPath "./dist/dsh-portable-$env:DSH_VERSION-win-x64.zip"
          $extract = Join-Path $env:RUNNER_TEMP 'dsh-portable-smoke'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & tar -xf $zip -C $extract
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed with exit code $LASTEXITCODE" }
          ./scripts/smoke-windows.ps1 `
            -StageDir (Join-Path $extract 'dsh-portable') `
            -ExpectedDshVersion $env:DSH_VERSION

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: dsh-portable-${{ inputs.dsh_version }}-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_VERSION: ${{ inputs.dsh_version }}
        run: |
          $ver = $env:DSH_VERSION
          $tag = "dsh-v$ver"
          $zip = Get-ChildItem dist/dsh-portable-*-win-x64.zip | Select-Object -First 1
          $sums = Get-Item dist/SHA256SUMS.txt
          $versions = ConvertFrom-StringData (Get-Content -LiteralPath versions.env -Raw)
          $node = $versions['NODE_VERSION']
          $pnpm = $versions['PNPM_VERSION']

          $notes = @"
          Unofficial Windows 11 x64 portable build of [DeepSeek Harness](https://github.com/deepseek-ai/deepseek-harness) ``dsh@$ver``.

          **Not affiliated with DeepSeek.** Bundles DeepSeek Harness from upstream tag ``$tag`` (npm when published, otherwise official ``release:pack``), official Node.js v$node, and pnpm v$pnpm.

          Upstream tag: https://github.com/deepseek-ai/deepseek-harness/releases/tag/$tag

          ### Use
          1. Unzip ``$($zip.Name)``
          2. Double-click ``start.cmd``
          3. Open http://127.0.0.1:3080

          Persistent data stays in ``data\`` (not ``%USERPROFILE%\.dsh``). Temp files use the system TEMP by default.

          Builds are unsigned — SmartScreen may require **More info → Run anyway**.
          Verify with ``SHA256SUMS.txt``.
          "@

          $notesFile = 'dist/release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName $sums.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "release asset upload failed with exit code $LASTEXITCODE" }
            if ($ver.Contains('-')) {
              gh release edit $tag --prerelease
              if ($LASTEXITCODE -ne 0) { throw "release prerelease update failed with exit code $LASTEXITCODE" }
            }
          } else {
            $args = @(
              'release', 'create', $tag, $zip.FullName, $sums.FullName,
              '--title', "dsh-portable $ver (win-x64)",
              '--notes-file', $notesFile,
              '--latest=false'
            )
            if ($ver.Contains('-')) { $args += '--prerelease' }
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "release creation failed with exit code $LASTEXITCODE" }
          }
