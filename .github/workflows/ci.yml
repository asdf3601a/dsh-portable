name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build + smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test release detection
        shell: pwsh
        run: ./scripts/test-resolve-upstream.ps1

      - name: Resolve dsh version (latest upstream dsh-v* / fallback)
        id: ver
        shell: pwsh
        run: |
          $versions = ConvertFrom-StringData (Get-Content -LiteralPath versions.env -Raw)
          $fallback = $versions['DSH_VERSION_FALLBACK']
          $ver = $fallback
          try {
            $rels = Invoke-RestMethod 'https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=10' -Headers @{
              'User-Agent' = 'dsh-portable-ci'
              'Accept' = 'application/vnd.github+json'
            }
            foreach ($rel in $rels) {
              if ($rel.tag_name -match '^dsh-v(.+)$') { $ver = $Matches[1]; break }
            }
          } catch {
            Write-Warning "could not list upstream releases; using fallback $fallback"
          }
          if (-not $ver) { $ver = $fallback }
          Write-Host "Using DSH_VERSION=$ver (upstream tag dsh-v$ver)"
          "dsh_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build portable ZIP
        shell: pwsh
        env:
          DSH_VERSION: ${{ steps.ver.outputs.dsh_version }}
        run: |
          ./scripts/build-windows.ps1 `
            -DshVersion $env:DSH_VERSION `
            -Source auto

      - name: Smoke test packaged ZIP
        shell: pwsh
        env:
          DSH_VERSION: ${{ steps.ver.outputs.dsh_version }}
        run: |
          $zip = Resolve-Path -LiteralPath "./dist/dsh-portable-$env:DSH_VERSION-win-x64.zip"
          $extract = Join-Path $env:RUNNER_TEMP 'dsh-portable-smoke'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & tar -xf $zip -C $extract
          if ($LASTEXITCODE -ne 0) { throw "tar extract failed with exit code $LASTEXITCODE" }
          ./scripts/smoke-windows.ps1 `
            -StageDir (Join-Path $extract 'dsh-portable') `
            -ExpectedDshVersion $env:DSH_VERSION

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-portable-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
