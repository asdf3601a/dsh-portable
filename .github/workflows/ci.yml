name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build + smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dsh version (latest upstream dsh-v* / fallback)
        id: ver
        shell: pwsh
        run: |
          $fallback = $null
          foreach ($line in Get-Content versions.env) {
            if ($line -match '^DSH_VERSION_FALLBACK=(.+)$') { $fallback = $Matches[1]; break }
          }
          $ver = $fallback
          try {
            $rels = Invoke-RestMethod 'https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=10' -Headers @{
              'User-Agent' = 'dsh-portable-ci'
              'Accept' = 'application/vnd.github+json'
            }
            foreach ($rel in $rels) {
              if ($rel.tag_name -match '^dsh-v(.+)$') { $ver = $Matches[1]; break }
            }
          } catch {
            Write-Warning "could not list upstream releases; using fallback $fallback"
          }
          if (-not $ver) { $ver = $fallback }
          Write-Host "Using DSH_VERSION=$ver (upstream tag dsh-v$ver)"
          "dsh_version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build portable ZIP
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 `
            -DshVersion '${{ steps.ver.outputs.dsh_version }}' `
            -Source auto

      - name: Smoke test
        shell: pwsh
        run: |
          ./scripts/smoke-windows.ps1 `
            -StageDir ./build/win-x64/dsh-portable `
            -ExpectedDshVersion '${{ steps.ver.outputs.dsh_version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-portable-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
